<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leaderboard · Big Brother DR Charts</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
  <h1>🏆 Leaderboard</h1>
  <div class="panel">
    <div class="controls">
      <label><input type="checkbox" id="inc-us" checked> Include BBUS</label>
      <label><input type="checkbox" id="inc-can" checked> Include BBCAN</label>
      <label><input type="checkbox" id="inc-spinoff" checked> Include spinoffs</label>
      <label><input type="checkbox" id="group-returning" checked> Group returning appearances</label>
    </div>
    <table class="plain" id="lb-table">
      <thead><tr><th>Rank</th><th>Houseguest</th><th>Season(s)</th><th># of DRs</th></tr></thead>
      <tbody></tbody>
    </table>
    <p class="muted" id="empty-note" style="display:none">No seasons match the current filters. Import a season or adjust the checkboxes above.</p>
  </div>
</main>
<script src="js/published-data.js"></script>
<script src="js/storage.js"></script>
<script src="js/common.js?v=2"></script>
<script>
renderNav('leaderboard.html');
renderFooter();

function render() {
  const incUs = document.getElementById('inc-us').checked;
  const incCan = document.getElementById('inc-can').checked;
  const incSpinoff = document.getElementById('inc-spinoff').checked;
  const grouping = document.getElementById('group-returning').checked;

  const seasons = Store.getAllSeasons().filter(s => {
    const kind = seasonKind(s.id);
    if (kind === 'us') return incUs;
    if (kind === 'can') return incCan;
    return incSpinoff;
  });
  function compareSeasonsChronologically(a, b) {
    const aMatch = /^(?:BB|BBCAN)(\d+)$/i.exec(a);
    const bMatch = /^(?:BB|BBCAN)(\d+)$/i.exec(b);
    if (aMatch && bMatch && Number(aMatch[1]) !== Number(bMatch[1])) {
      return Number(aMatch[1]) - Number(bMatch[1]);
    }
    return a.localeCompare(b, undefined, { numeric: true });
  }
  function tieBreakFor(season, player) {
    const total = playerTotal(player);
    let runningTotal = 0;
    let reachedEpisode = Infinity;
    for (const episode of player.episodes) {
      if (!isCountedCell(episode)) continue;
      runningTotal += episode.value || 0;
      if (runningTotal >= total) {
        reachedEpisode = episode.episode;
        break;
      }
    }
    return {
      tieSeason: season.id,
      reachedEpisode,
      placement: player.placement
    };
  }

  let rows = [];
  if (!grouping) {
    for (const s of seasons) {
      for (const p of s.players) {
        rows.push({ name: p.name, seasons: [s.id], winningSeasons: Math.round(p.placement) === 1 ? new Set([s.id]) : new Set(), dr: playerTotal(p), ...tieBreakFor(s, p) });
      }
    }
  } else {
    const groups = Store.getLinkGroups();
    const consumed = new Set();
    const key = (season, name) => season + '::' + name;
    for (const s of seasons) {
      for (const p of s.players) {
        const k = key(s.id, p.name);
        if (consumed.has(k)) continue;
        const group = groups.find(g => g.some(ap => ap.season === s.id && ap.name === p.name));
        if (group) {
          let dr = 0; const seasonIds = []; const winningSeasons = new Set();
          for (const ap of group) {
            consumed.add(key(ap.season, ap.name));
            const sObj = seasons.find(x => x.id === ap.season) || Store.getSeason(ap.season);
            if (!sObj) continue;
            const pl = sObj.players.find(x => x.name === ap.name);
            if (pl && seasons.some(x=>x.id===ap.season)) {
              dr += playerTotal(pl);
              seasonIds.push(ap.season);
              if (Math.round(pl.placement) === 1) winningSeasons.add(ap.season);
            }
          }
          seasonIds.sort(compareSeasonsChronologically);
          rows.push({ name: p.name, seasons: seasonIds, winningSeasons, dr, ...tieBreakFor(s, p) });
        } else {
          consumed.add(k);
          rows.push({ name: p.name, seasons: [s.id], winningSeasons: Math.round(p.placement) === 1 ? new Set([s.id]) : new Set(), dr: playerTotal(p), ...tieBreakFor(s, p) });
        }
      }
    }
  }

  rows.sort((a, b) =>
    (b.dr - a.dr) ||
    compareSeasonsChronologically(a.tieSeason, b.tieSeason) ||
    (a.reachedEpisode - b.reachedEpisode) ||
    (a.placement - b.placement) ||
    a.name.localeCompare(b.name)
  );

  const tbody = document.querySelector('#lb-table tbody');
  tbody.innerHTML = '';
  rows.forEach((r, i) => {
    const tr = document.createElement('tr');
    const nonReindeerSeasons = r.seasons.filter(season => !/^BBRG/i.test(season));
    const mostRecentSeason = nonReindeerSeasons[nonReindeerSeasons.length - 1] || r.seasons[r.seasons.length - 1];
    const seasonLabels = r.seasons.map(season => `${escapeHtml(season)}${r.winningSeasons && r.winningSeasons.has(season) ? ' <span class="season-trophy" title="Season winner">🏆</span>' : ''}`);
    tr.innerHTML = `<td>${rankChipHtml(i+1)}</td><td data-name="${escapeHtml(r.name)}">${nameCellHtml(r.name, mostRecentSeason)}</td><td>${seasonLabels.join(', ')}</td><td>${formatNum(r.dr)}</td>`;
    tbody.appendChild(tr);
  });
  document.getElementById('empty-note').style.display = rows.length ? 'none' : 'block';
}

['inc-us','inc-can','inc-spinoff','group-returning'].forEach(id =>
  document.getElementById(id).addEventListener('change', render));
render();
</script>
</body>
</html>
